<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>亞培電商工具台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing: border-box;
    --ink: #000000;
    --panel: #000000;
    --panel-2: #060606;
    --line: #303030;
    --text: #FFFFFF;
    --muted: #B4B4B4;
    --amber: #E8A33D;
    --amber-dim: #4a3a17;
    --teal: #4FB8A0;
    --danger: #D97757;
    --matcha: #9DBD8A;
    --matcha-dim: rgba(157,189,138,.16);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  /* fixed dark/black theme regardless of system preference — explicit user choice */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#000000; --panel:#000000; --panel-2:#060606; --line:#303030; --text:#FFFFFF; --muted:#B4B4B4;
    }
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',"Noto Serif TC",serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}

  /* ---- shell layout ---- */
  .shell{
    display:flex;
    min-height:100%;
  }
  .rail{
    width:216px;
    flex:0 0 216px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:28px 14px 20px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .brand{
    padding:0 10px;
  }
  .brand .mark{
    font-size:26px;
    line-height:1;
    display:block;
    margin-bottom:8px;
  }
  .brand h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--text);
  }
  .brand p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
  }
  nav.cats{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .cat-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--muted);
    font:inherit;
    font-size:14.5px;
    font-weight:500;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .cat-btn .ico{font-size:16px; width:20px; text-align:center;}
  .cat-btn .count{
    margin-left:auto;
    font-size:11.5px;
    color:var(--muted);
    background:rgba(255,255,255,.05);
    padding:1px 7px;
    border-radius:20px;
  }
  .cat-btn:hover{background:rgba(255,255,255,.06); color:var(--text);}
  .cat-btn.active{
    background:var(--matcha-dim);
    color:var(--matcha);
  }
  .cat-btn.active .count{background:rgba(157,189,138,.22); color:var(--matcha);}

  .rail-foot{
    margin-top:auto;
    font-size:11.5px;
    color:var(--muted);
    padding:0 10px;
    line-height:1.6;
  }

  /* ---- mobile top tabs ---- */
  .tabbar{display:none;}

  /* ---- main ---- */
  main{
    flex:1;
    min-width:0;
    padding:34px 40px 60px;
  }
  .topline{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .topline h2{
    font-size:26px;
    margin:0 0 6px;
  }
  .topline .sub{
    color:var(--muted);
    font-size:13.5px;
    max-width:520px;
    line-height:1.55;
  }
  .search{
    position:relative;
    width:260px;
    flex:0 0 auto;
  }
  .search input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px 10px 34px;
    border-radius:9px;
    font:inherit;
    font-size:13.5px;
    outline:none;
  }
  .search input:focus{border-color:var(--amber);}
  .search::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted);
    font-size:16px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:126px;
  }
  .card h3{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    margin:0;
    line-height:1.4;
    color:var(--text);
  }
  .card p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.55;
    flex:1;
  }
  .card .links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:2px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:7px;
    text-decoration:none;
    background:var(--amber-dim);
    color:var(--amber);
    border:1px solid transparent;
    transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.2);}
  .btn.secondary{
    background:transparent;
    border-color:var(--line);
    color:var(--muted);
  }
  .btn.secondary:hover{color:var(--text); border-color:var(--muted);}

  .card.muted{
    background:transparent;
    border-style:dashed;
    opacity:.85;
  }
  .card.muted .btn{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .card.muted .btn:hover{color:var(--text);}

  .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    background:rgba(79,184,160,.12);
    color:var(--teal);
    width:fit-content;
  }
  .tag.warn{background:rgba(217,119,87,.14); color:var(--danger);}

  /* ---- hero panel for 指派工作器 ---- */
  .hero{
    background:linear-gradient(155deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 28px;
    margin-bottom:20px;
  }
  .hero h3{font-size:18px; margin:0 0 10px;}
  .hero p{font-size:13.5px; color:var(--muted); line-height:1.7; max-width:640px; margin:0 0 18px;}
  .hero .links{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .hero .btn{padding:9px 16px; font-size:13px;}
  .owner-table{
    border-top:1px solid var(--line);
    padding-top:16px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .owner-table .row{font-size:12px; color:var(--muted);}
  .owner-table .row b{display:block; color:var(--text); font-size:13px; margin-bottom:2px;}

  .empty{
    color:var(--muted);
    font-size:13.5px;
    padding:40px 0;
    text-align:center;
  }

  /* ---- timeline ---- */
  .tl-toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .tl-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:12px;
    color:var(--muted);
  }
  .tl-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.urgent{background:#E0604A;}
  .dot.soon{background:#E8C13D;}
  .dot.ok{background:#5FBF8F;}
  .dot.done{background:#5B6478;}
  .dot.unknown{background:#7A86A6;}
  .tl-nav{display:flex; gap:6px; margin-left:auto;}
  .tl-nav button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:6px 11px;
    border-radius:7px;
    font:inherit;
    font-size:12.5px;
    cursor:pointer;
  }
  .tl-nav button:hover{border-color:var(--muted);}
  .tl-range{font-size:12px; color:var(--muted); align-self:center;}

  .tl-board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px 18px 14px;
    overflow:hidden;
  }
  .tl-ruler{
    display:flex;
    position:relative;
    height:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .tl-ruler .tick{
    position:absolute;
    top:0; bottom:0;
    border-left:1px dashed rgba(255,255,255,.08);
    font-size:10.5px;
    color:var(--muted);
    padding-left:4px;
    padding-top:6px;
    white-space:nowrap;
  }
  .tl-ruler .today-tick{border-left:1px solid var(--amber);}
  .tl-ruler .today-tick span{color:var(--amber); font-weight:600;}

  .tl-lane{
    display:flex;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .tl-lane:last-child{border-bottom:none;}
  .tl-lane-label{
    flex:0 0 108px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    padding-top:4px;
  }
  .tl-lane-label small{
    display:block;
    font-weight:400;
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
  }
  .tl-track{
    flex:1;
    position:relative;
    min-height:34px;
  }
  .tl-track .today-line{
    position:absolute;
    top:0; bottom:0;
    width:0;
    border-left:1px solid rgba(232,163,61,.35);
  }
  .tl-row{position:relative; height:26px;}
  .tl-chip{
    position:absolute;
    top:0;
    transform:translateX(-4px);
    max-width:150px;
    background:var(--panel-2);
    border-left:3px solid var(--muted);
    border-radius:4px;
    padding:3px 8px;
    font-size:11px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:default;
  }
  .tl-chip.urgent{border-left-color:#E0604A;}
  .tl-chip.soon{border-left-color:#E8C13D;}
  .tl-chip.ok{border-left-color:#5FBF8F;}
  .tl-chip.done{border-left-color:#5B6478; color:var(--muted);}
  .tl-chip.unknown{border-left-color:#7A86A6;}
  .tl-overflow{
    font-size:11px;
    color:var(--muted);
    padding-top:4px;
  }
  .tl-state{
    padding:34px 14px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .tl-state .btn{margin-top:12px;}
  .tl-foot-links{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  /* ---- 公告欄 ---- */
  .ann-composer{
    margin-bottom:18px;
  }
  .ann-composer input,
  .ann-composer textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font:inherit;
    font-size:13.5px;
    margin-bottom:8px;
    resize:vertical;
  }
  .ann-composer input:focus,
  .ann-composer textarea:focus{ outline:none; border-color:var(--matcha); }
  .ann-list{ display:flex; flex-direction:column; gap:12px; }
  .ann-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .ann-item-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .ann-item-head strong{ font-size:14.5px; color:var(--text); }
  .ann-meta{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .ann-body{
    font-size:13px;
    color:var(--text);
    line-height:1.7;
    white-space:pre-wrap;
  }
  .ann-del{ margin-top:10px; font-size:11.5px; padding:5px 10px; }
  .ann-del-confirm{
    margin-top:10px; font-size:11.5px; padding:5px 10px;
    background:rgba(224,96,74,.18); color:#E0604A; border:1px solid rgba(224,96,74,.4);
  }

  /* ---- 公告欄／行事曆 子頁籤 ---- */
  .subtabs{
    display:flex;
    gap:6px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .subtab-btn{
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--muted);
    font:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:9px 4px;
    margin-bottom:-1px;
    cursor:pointer;
  }
  .subtab-btn:hover{ color:var(--text); }
  .subtab-btn.active{ color:var(--matcha); border-bottom-color:var(--matcha); }

  /* ---- 大事紀行事曆 ---- */
  .cal-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .cal-title{ font-size:15px; font-weight:600; }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:5px;
    margin-bottom:18px;
  }
  .cal-weekday{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding-bottom:4px;
  }
  .cal-cell{
    min-height:82px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:3px;
    overflow:hidden;
  }
  .cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .cal-cell:hover:not(.empty){ border-color:var(--muted); }
  .cal-cell.today .cal-daynum{ color:var(--amber); font-weight:700; }
  .cal-cell.selected{ border-color:var(--matcha); background:var(--matcha-dim); }
  .cal-daynum{ font-size:12px; color:var(--text); flex:0 0 auto; }
  .cal-events{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cal-ev-chip{
    font-size:10.5px;
    line-height:1.3;
    color:var(--text);
    background:rgba(157,189,138,.16);
    border-left:2px solid var(--matcha);
    border-radius:3px;
    padding:1px 4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-ev-more{ font-size:10px; color:var(--muted); padding-left:4px; }
  .cal-selected-head{ font-size:13.5px; font-weight:600; margin-bottom:10px; }
  @media (max-width: 860px){
    .cal-cell{ min-height:64px; padding:4px; }
    .cal-daynum{ font-size:11px; }
    .cal-ev-chip{ font-size:9.5px; padding:1px 3px; }
  }

  footer.note{
    margin-top:36px;
    font-size:11.5px;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:14px;
  }

  @media (max-width: 860px){
    .rail{display:none;}
    .tabbar{
      display:flex;
      overflow-x:auto;
      gap:6px;
      padding:14px 14px 10px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:5;
      -webkit-overflow-scrolling:touch;
    }
    .tabbar::-webkit-scrollbar{display:none;}
    .tabbar .cat-btn{
      flex:0 0 auto;
      white-space:nowrap;
      padding:8px 12px;
    }
    .tabbar .count{display:none;}
    main{padding:22px 18px 50px;}
    .topline{flex-direction:column;}
    .search{width:100%;}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- desktop sidebar -->
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="mark">🧭</span>
      <h1>亞培電商工具台</h1>
      <p>常用試算表 / Apps Script 快速入口</p>
    </div>
    <nav class="cats" id="cats"></nav>
    <div class="rail-foot">
      整理於 2026/09/21<br>
      連結失效或要調整分類，直接跟 Claude 說。
    </div>
  </aside>

  <main>
    <!-- mobile tabs -->
    <div class="tabbar" id="tabbar"></div>

    <div class="topline">
      <div>
        <h2 id="catTitle" class="display"></h2>
        <div class="sub" id="catSub"></div>
      </div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜尋工具名稱…">
      </div>
    </div>

    <div id="content"></div>

    <footer class="note">
      這頁只做「快速連結」入口，不會即時執行任一份 Apps Script 的選單功能——點卡片會開啟對應 Google Sheet 新分頁，選單動作仍要在 Sheet 裡自己按。
    </footer>
  </main>
</div>

<script>

/* ================= 共用小工具 ================= */
function escapeHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

// This standalone file has no Claude runtime, so the board always
// falls back to this browser's own localStorage (personal, not shared).
const ANN_LOCAL_KEY = 'abbott_announcements_v1';
let annState = null;
let annComposerOpen = false;
let annDeletePendingId = null;

function loadLocalAnnouncements(){
  try{ const raw = localStorage.getItem(ANN_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLocalAnnouncements(list){
  try{ localStorage.setItem(ANN_LOCAL_KEY, JSON.stringify(list)); }catch(e){}
}
function initAnnounce(){
  const list = loadLocalAnnouncements().sort((a,b)=>b.createdAt-a.createdAt);
  annState = {docs:list};
  renderAnnounceInto();
}
function toggleAnnComposer(){ annComposerOpen = !annComposerOpen; renderAnnounceInto(); }
function submitAnnouncement(){
  const titleEl = document.getElementById('annTitle');
  const bodyEl = document.getElementById('annBody');
  const title = (titleEl.value||'').trim();
  const content = (bodyEl.value||'').trim();
  if(!content){ bodyEl.focus(); return; }
  const list = loadLocalAnnouncements();
  list.push({id:'a'+Date.now(), title: title||'(無標題)', content, createdAt: Date.now()});
  saveLocalAnnouncements(list);
  annState.docs = list.sort((a,b)=>b.createdAt-a.createdAt);
  annComposerOpen = false;
  renderAnnounceInto();
}
// No native confirm() — click once to arm, click the same button again to confirm.
function requestDeleteAnnouncement(id){
  if(annDeletePendingId === id){
    annDeletePendingId = null;
    const list = loadLocalAnnouncements().filter(a=>a.id!==id);
    saveLocalAnnouncements(list);
    annState.docs = list.sort((a,b)=>b.createdAt-a.createdAt);
  } else {
    annDeletePendingId = id;
  }
  renderAnnounceInto();
}
function renderAnnounceInto(){
  if(activeCat !== 'announce' || announceSubTab !== 'board') return;
  const body = document.getElementById('announceHubBody');
  if(!body) return;
  if(!annState){ body.innerHTML = `<div class="tl-state">正在讀取…</div>`; return; }
  const noteHTML = `<div class="tag warn" style="margin-bottom:14px;">這份是獨立下載版，公告只存在您這台裝置的瀏覽器裡，不會同步給其他同事。要讓全組共用，請用 claude.ai 那個連結。</div>`;
  const composerHTML = annComposerOpen ? `
    <div class="ann-composer">
      <input id="annTitle" type="text" placeholder="標題（選填）">
      <textarea id="annBody" rows="3" placeholder="公告內容…"></textarea>
      <div class="links">
        <button class="btn" onclick="submitAnnouncement()">發布</button>
        <button class="btn secondary" onclick="toggleAnnComposer()">取消</button>
      </div>
    </div>` : `
    <div class="ann-composer">
      <button class="btn" onclick="toggleAnnComposer()">＋ 發布公告</button>
    </div>`;
  const docs = annState.docs || [];
  const listHTML = docs.length ? docs.map(d=>{
    const date = new Date(d.createdAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const pending = annDeletePendingId === d.id;
    return `<div class="ann-item">
      <div class="ann-item-head">
        <strong>${escapeHtml(d.title||'(無標題)')}</strong>
        <span class="ann-meta">${date}</span>
      </div>
      <div class="ann-body">${escapeHtml(d.content)}</div>
      <button class="btn ${pending?'ann-del-confirm':'secondary ann-del'}" onclick="requestDeleteAnnouncement('${d.id}')">${pending?'再按一次確定刪除':'刪除'}</button>
    </div>`;
  }).join('') : `<div class="empty">目前還沒有公告。</div>`;
  body.innerHTML = `${noteHTML}${composerHTML}<div class="ann-list">${listHTML}</div>`;
}

const EV_LOCAL_KEY = 'abbott_events_v1';
let evState = null;
let evMonthOffset = 0;
let evSelectedDate = null;
let evComposerOpen = false;
let evDeletePendingId = null;

function loadLocalEvents(){
  try{ const raw = localStorage.getItem(EV_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLocalEvents(list){
  try{ localStorage.setItem(EV_LOCAL_KEY, JSON.stringify(list)); }catch(e){}
}
function initEvents(){
  evState = {docs: loadLocalEvents()};
  renderEventsInto();
}
function eventsShiftMonth(delta){ evMonthOffset += delta; renderEventsInto(); }
function eventsSelectDate(dateStr){ evSelectedDate = dateStr; evComposerOpen = false; renderEventsInto(); }
function toggleEventComposer(){ evComposerOpen = !evComposerOpen; renderEventsInto(); }
function submitEvent(){
  const dateEl = document.getElementById('evDate');
  const titleEl = document.getElementById('evTitle');
  const noteEl = document.getElementById('evNote');
  const date = dateEl.value;
  const title = (titleEl.value||'').trim();
  const note = (noteEl.value||'').trim();
  if(!date || !title){ titleEl.focus(); return; }
  const list = loadLocalEvents();
  list.push({id:'e'+Date.now(), date, title, note, createdAt: Date.now()});
  saveLocalEvents(list);
  evState.docs = list;
  evComposerOpen = false;
  evSelectedDate = date;
  renderEventsInto();
}
function requestDeleteEvent(id){
  if(evDeletePendingId === id){
    evDeletePendingId = null;
    const list = loadLocalEvents().filter(e=>e.id!==id);
    saveLocalEvents(list);
    evState.docs = list;
  } else {
    evDeletePendingId = id;
  }
  renderEventsInto();
}
function renderEventsInto(){
  if(activeCat !== 'announce' || announceSubTab !== 'calendar') return;
  const body = document.getElementById('announceHubBody');
  if(!body) return;
  if(!evState){ body.innerHTML = `<div class="tl-state">正在讀取…</div>`; return; }

  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth()+evMonthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = ymd(today);
  if(!evSelectedDate) evSelectedDate = todayStr;

  const byDate = {};
  (evState.docs||[]).forEach(d=>{ (byDate[d.date] = byDate[d.date]||[]).push(d); });

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${pad2(month+1)}-${pad2(day)}`;
    const dayEvents = byDate[dateStr] || [];
    const isToday = dateStr===todayStr;
    const isSel = dateStr===evSelectedDate;
    const shown = dayEvents.slice(0,3).map(ev=>`<div class="cal-ev-chip" title="${escapeHtml(ev.title||'')}">${escapeHtml(ev.title||'(無標題)')}</div>`).join('');
    const moreCount = dayEvents.length - 3;
    cells += `<div class="cal-cell${isToday?' today':''}${isSel?' selected':''}" onclick="eventsSelectDate('${dateStr}')">
      <span class="cal-daynum">${day}</span>
      <div class="cal-events">
        ${shown}
        ${moreCount > 0 ? `<div class="cal-ev-more">+${moreCount} 筆</div>` : ''}
      </div>
    </div>`;
  }
  const weekLabels = ['日','一','二','三','四','五','六'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const selEvents = byDate[evSelectedDate] || [];
  const selList = selEvents.length ? selEvents.map(d=>{
    const pending = evDeletePendingId === d.id;
    return `<div class="ann-item">
      <div class="ann-item-head"><strong>${escapeHtml(d.title||'(無標題)')}</strong></div>
      ${d.note ? `<div class="ann-body">${escapeHtml(d.note)}</div>` : ''}
      <button class="btn ${pending?'ann-del-confirm':'secondary ann-del'}" onclick="requestDeleteEvent('${d.id}')">${pending?'再按一次確定刪除':'刪除'}</button>
    </div>`;
  }).join('') : `<div class="empty">這天還沒有大事紀。</div>`;

  const composerHTML = evComposerOpen ? `
    <div class="ann-composer">
      <input id="evDate" type="date" value="${evSelectedDate}">
      <input id="evTitle" type="text" placeholder="事項標題">
      <textarea id="evNote" rows="2" placeholder="備註（選填）"></textarea>
      <div class="links">
        <button class="btn" onclick="submitEvent()">新增</button>
        <button class="btn secondary" onclick="toggleEventComposer()">取消</button>
      </div>
    </div>` : `
    <div class="ann-composer">
      <button class="btn" onclick="toggleEventComposer()">＋ 新增大事紀</button>
    </div>`;

  const noteHTML = `<div class="tag warn" style="margin-bottom:14px;">這份是獨立下載版，大事紀只存在您這台裝置的瀏覽器裡，不會同步給其他同事。要讓全組共用，請用 claude.ai 那個連結。</div>`;

  body.innerHTML = `
    ${noteHTML}
    <div class="cal-toolbar">
      <button class="btn secondary" onclick="eventsShiftMonth(-1)">‹ 上個月</button>
      <div class="cal-title">${year}年${month+1}月</div>
      <button class="btn secondary" onclick="eventsShiftMonth(1)">下個月 ›</button>
    </div>
    <div class="cal-grid">
      ${weekLabels}
      ${cells}
    </div>
    <div class="cal-selected-head">📌 ${evSelectedDate}</div>
    <div class="ann-list">${selList}</div>
    ${composerHTML}
  `;
}

/* ================= 公告欄／行事曆 分頁切換 ================= */
let announceSubTab = 'board'; // 'board' | 'calendar'

function switchAnnounceSubTab(tab){
  announceSubTab = tab;
  renderAnnounceHub();
}

function renderAnnounceHub(){
  contentEl.innerHTML = `
    <div class="subtabs">
      <button class="subtab-btn ${announceSubTab==='board'?'active':''}" onclick="switchAnnounceSubTab('board')">📣 公告</button>
      <button class="subtab-btn ${announceSubTab==='calendar'?'active':''}" onclick="switchAnnounceSubTab('calendar')">📅 大事紀行事曆</button>
    </div>
    <div id="announceHubBody"></div>
  `;
  if(announceSubTab === 'calendar') initEvents(); else initAnnounce();
}

/* ================= render ================= */

function render(){
  renderNav();
  const cat = DATA.find(c=>c.id===activeCat);
  catTitle.textContent = `${cat.icon} ${cat.label}`;
  catSub.textContent = cat.sub;

  if(cat.special){
    if(cat.id === 'announce'){
      renderAnnounceHub();
    } else {
      contentEl.innerHTML = renderTasker();
    }
    return;
  }

  const q = query.trim().toLowerCase();
  const items = q
    ? cat.items.filter(it => (it.name+it.desc).toLowerCase().includes(q))
    : cat.items;

  if(items.length===0){
    contentEl.innerHTML = `<div class="empty">找不到符合「${query}」的項目。</div>`;
    return;
  }

  contentEl.innerHTML = `<div class="grid">${items.map(it=>cardHTML(it, cat.muted?'muted':'')).join('')}</div>`;
}


searchInput.addEventListener('input', (e)=>{ query = e.target.value; render(); });

render();
</script>
