<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>亞培電商工具台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing: border-box;
    --ink: #FFFFFF;
    --panel: #FFFFFF;
    --panel-2: #F4F2EA;
    --line: #E4E0D4;
    --text: #17170F;
    --muted: #6B6A5E;
    --amber: #FF7A1A;
    --amber-dim: #FFE4CC;
    --teal: #2DA9E0;
    --danger: #E0604A;
    --matcha: #1F9D55;
    --matcha-dim: rgba(31,157,85,.13);
    --acc1: #2DA9E0;
    --acc2: #E0457B;
    --acc3: #FF7A1A;
    --acc4: #1F9D55;
    --acc5: #8B5CF6;
    --acc6: #D6A400;
    --acc1-dim: #DFF1FA;
    --acc2-dim: #FBE2EA;
    --acc3-dim: #FFE9D6;
    --acc4-dim: #DEF3E6;
    --acc5-dim: #EDE6FC;
    --acc6-dim: #FAF0D2;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  /* fixed white/light theme regardless of system preference — explicit user choice */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="dark"]){
      --ink:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F2EA; --line:#E4E0D4; --text:#17170F; --muted:#6B6A5E;
    }
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',"Noto Serif TC",serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}

  /* ---- shell layout ---- */
  .shell{
    display:flex;
    min-height:100%;
  }
  .rail{
    width:216px;
    flex:0 0 216px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:28px 14px 20px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .brand{
    padding:0 10px;
  }
  .brand .mark{
    font-size:22px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(135deg, var(--acc1-dim), var(--acc3-dim));
    margin-bottom:10px;
  }
  .brand h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--text);
  }
  .brand p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
  }
  nav.cats{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-right:4px;
  }
  nav.cats::-webkit-scrollbar{ width:6px; }
  nav.cats::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  nav.cats::-webkit-scrollbar-track{ background:transparent; }
  .cat-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--muted);
    font:inherit;
    font-size:14.5px;
    font-weight:500;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .cat-btn .ico{
    font-size:14px;
    width:26px;
    height:26px;
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:var(--ico-bg, var(--panel-2));
  }
  .cat-btn .count{
    margin-left:auto;
    font-size:11.5px;
    color:var(--muted);
    background:rgba(0,0,0,.045);
    padding:1px 7px;
    border-radius:20px;
  }
  .cat-btn:hover{background:rgba(0,0,0,.05); color:var(--text);}
  .cat-btn.active{
    background:var(--matcha-dim);
    color:var(--matcha);
  }
  .cat-btn.active .count{background:rgba(31,157,85,.20); color:var(--matcha);}
  .cat-edit-btns{
    display:flex;
    gap:2px;
    margin-left:6px;
  }
  .cat-label-input{
    flex:1;
    min-width:0;
    font:inherit;
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 7px;
  }
  .cat-label-input:focus{ outline:none; border-color:var(--amber); }
  .ebtn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font:inherit;
    font-size:11px;
    padding:4px 7px;
    border-radius:6px;
    cursor:pointer;
  }
  .ebtn:hover{ color:var(--text); border-color:var(--muted); }
  .ebtn.mini{ padding:2px 6px; font-size:10.5px; }
  .ebtn.danger{ color:var(--danger); }
  .ebtn.danger:hover{ border-color:var(--danger); }
  .card.editing{ border-color:var(--amber); }
  .edit-bar{
    position:absolute;
    top:-10px;
    right:14px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    background:var(--panel);
    padding:3px 6px;
    border-radius:8px;
    border:1px solid var(--line);
  }

  .rail-foot{
    margin-top:auto;
    font-size:11.5px;
    color:var(--muted);
    padding:0 10px;
    line-height:1.6;
  }

  /* ---- mobile top tabs ---- */
  .tabbar{display:none;}

  /* ---- main ---- */
  main{
    flex:1;
    min-width:0;
    padding:34px 40px 60px;
  }
  .topline{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    margin-bottom:26px;
    flex-wrap:wrap;
    padding:24px 26px 22px;
    border-radius:18px;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.09), transparent 42%),
      radial-gradient(circle at 82% 75%, rgba(255,255,255,.07), transparent 45%),
      linear-gradient(160deg, #0B2A1A 0%, #14472B 45%, #256B3F 75%, #4A9860 100%);
  }
  .topline::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 8% 25%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.6px 1.6px at 30% 65%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.2px 1.2px at 50% 20%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.6px 1.6px at 72% 58%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.2px 1.2px at 90% 30%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.2px 1.2px at 62% 82%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.2px 1.2px at 20% 85%, rgba(255,255,255,.28), transparent);
    pointer-events:none;
  }
  .topline > *{ position:relative; }
  .topline h2{
    font-size:24px;
    margin:0 0 6px;
    color:#fff;
  }
  .topline .sub{
    color:rgba(245,240,255,.72);
    font-size:13.5px;
    max-width:520px;
    line-height:1.55;
  }
  .topline .search input{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
  }
  .topline .search input::placeholder{ color:rgba(245,240,255,.55); }
  .topline .search::before{ color:rgba(245,240,255,.6); }
  .topline .btn.secondary{
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.3);
    color:#fff;
  }
  .topline .btn.secondary:hover{ background:rgba(255,255,255,.2); color:#fff; border-color:rgba(255,255,255,.45); }
  .topline .btn{ background:rgba(255,255,255,.92); }
  .topline-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .edit-toggle-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search{
    position:relative;
    width:260px;
    flex:0 0 auto;
  }
  .search input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px 10px 34px;
    border-radius:9px;
    font:inherit;
    font-size:13.5px;
    outline:none;
  }
  .search input:focus{border-color:var(--amber);}
  .search::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted);
    font-size:16px;
  }

  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--panel);
    position:relative;
    border:1px solid var(--line);
    border-left:3px solid var(--card-accent, var(--line));
    border-radius:12px;
    padding:16px 20px;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:22px;
    min-height:unset;
    box-shadow:0 1px 2px rgba(23,23,15,.04), 0 2px 8px rgba(23,23,15,.05);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{
    box-shadow:0 2px 4px rgba(23,23,15,.06), 0 6px 16px rgba(23,23,15,.08);
    transform:translateY(-1px);
  }
  .card-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card h3{
    font-family:'Inter',"Noto Sans TC","PingFang TC",sans-serif;
    font-weight:700;
    font-size:15.5px;
    margin:0;
    line-height:1.4;
    color:var(--text);
  }
  .card p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
    flex:none;
  }
  .card .links{
    display:flex;
    flex:0 0 auto;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:4px 16px;
    margin-top:0;
    max-width:220px;
  }
  .card-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    color:var(--muted);
    padding:0;
    background:none;
    border:none;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .card-link.primary{ color:var(--card-accent, var(--amber)); }
  .card-link:hover{ border-bottom-color:currentColor; }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:7px;
    text-decoration:none;
    background:var(--amber-dim);
    color:var(--amber);
    border:1px solid transparent;
    transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.2);}
  .btn.secondary{
    background:transparent;
    border-color:var(--line);
    color:var(--muted);
  }
  .btn.secondary:hover{color:var(--text); border-color:var(--muted);}

  .card.muted{
    background:transparent;
    border-style:dashed;
    opacity:.85;
  }
  .card.muted .card-link{ color:var(--muted); }
  .card.muted .card-link:hover{ color:var(--text); }

  .card.card-wide{ grid-column: 1 / -1; }
  .tree-wrap{ margin-top:6px; }
  .ttree{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:13.5px;
  }
  .tfolder{
    font-weight:600;
    color:var(--text);
    padding:7px 0;
  }
  .tleaf{
    display:block;
    color:var(--matcha);
    text-decoration:none;
    padding:7px 0;
    width:fit-content;
  }
  .tleaf:hover{ text-decoration:underline; }
  .tnode{ margin-bottom:2px; }
  .tchildren{
    padding-left:20px;
    margin-left:8px;
    border-left:1px dashed var(--line);
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:2px;
    margin-bottom:6px;
  }

  .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    background:rgba(45,169,224,.14);
    color:var(--teal);
    width:fit-content;
  }
  .tag.warn{background:rgba(224,96,74,.14); color:var(--danger);}

  /* ---- hero panel for 指派工作器 ---- */
  .hero{
    background:linear-gradient(155deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 28px;
    margin-bottom:20px;
  }
  .hero h3{font-size:18px; margin:0 0 10px;}
  .hero p{font-size:13.5px; color:var(--muted); line-height:1.7; max-width:640px; margin:0 0 18px;}
  .hero .links{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .hero .btn{padding:9px 16px; font-size:13px;}
  .owner-table{
    border-top:1px solid var(--line);
    padding-top:16px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .owner-table .row{font-size:12px; color:var(--muted);}
  .owner-table .row b{display:block; color:var(--text); font-size:13px; margin-bottom:2px;}

  .empty{
    color:var(--muted);
    font-size:13.5px;
    padding:40px 0;
    text-align:center;
  }

  /* ---- timeline ---- */
  .tl-toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .tl-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:12px;
    color:var(--muted);
  }
  .tl-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.urgent{background:#E0604A;}
  .dot.soon{background:#C9971F;}
  .dot.ok{background:#5FBF8F;}
  .dot.done{background:#5B6478;}
  .dot.unknown{background:#7A86A6;}
  .tl-nav{display:flex; gap:6px; margin-left:auto;}
  .tl-nav button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:6px 11px;
    border-radius:7px;
    font:inherit;
    font-size:12.5px;
    cursor:pointer;
  }
  .tl-nav button:hover{border-color:var(--muted);}
  .tl-range{font-size:12px; color:var(--muted); align-self:center;}

  .tl-board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px 18px 14px;
    overflow:hidden;
  }
  .tl-ruler{
    display:flex;
    position:relative;
    height:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .tl-ruler .tick{
    position:absolute;
    top:0; bottom:0;
    border-left:1px dashed rgba(0,0,0,.10);
    font-size:10.5px;
    color:var(--muted);
    padding-left:4px;
    padding-top:6px;
    white-space:nowrap;
  }
  .tl-ruler .today-tick{border-left:1px solid var(--amber);}
  .tl-ruler .today-tick span{color:var(--amber); font-weight:600;}

  .tl-lane{
    display:flex;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .tl-lane:last-child{border-bottom:none;}
  .tl-lane-label{
    flex:0 0 108px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    padding-top:4px;
  }
  .tl-lane-label small{
    display:block;
    font-weight:400;
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
  }
  .tl-track{
    flex:1;
    position:relative;
    min-height:34px;
  }
  .tl-track .today-line{
    position:absolute;
    top:0; bottom:0;
    width:0;
    border-left:1px solid rgba(232,163,61,.35);
  }
  .tl-row{position:relative; height:26px;}
  .tl-chip{
    position:absolute;
    top:0;
    transform:translateX(-4px);
    max-width:150px;
    background:var(--panel-2);
    border-left:3px solid var(--muted);
    border-radius:4px;
    padding:3px 8px;
    font-size:11px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:default;
  }
  .tl-chip.urgent{border-left-color:#E0604A;}
  .tl-chip.soon{border-left-color:#C9971F;}
  .tl-chip.ok{border-left-color:#5FBF8F;}
  .tl-chip.done{border-left-color:#5B6478; color:var(--muted);}
  .tl-chip.unknown{border-left-color:#7A86A6;}
  .tl-overflow{
    font-size:11px;
    color:var(--muted);
    padding-top:4px;
  }
  .tl-state{
    padding:34px 14px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .tl-state .btn{margin-top:12px;}
  .tl-foot-links{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  /* ---- 公告欄 ---- */
  .ann-composer{
    margin-bottom:18px;
  }
  .ann-composer input,
  .ann-composer textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font:inherit;
    font-size:13.5px;
    margin-bottom:8px;
    resize:vertical;
  }
  .ann-composer input:focus,
  .ann-composer textarea:focus{ outline:none; border-color:var(--matcha); }
  .ann-list{ display:flex; flex-direction:column; gap:12px; }
  .ann-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .ann-item-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .ann-item-head strong{ font-size:14.5px; color:var(--text); }
  .ann-meta{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .ann-body{
    font-size:13px;
    color:var(--text);
    line-height:1.7;
    white-space:pre-wrap;
  }
  .ann-del{ margin-top:10px; font-size:11.5px; padding:5px 10px; }
  .ann-del-confirm{
    margin-top:10px; font-size:11.5px; padding:5px 10px;
    background:rgba(224,96,74,.18); color:#E0604A; border:1px solid rgba(224,96,74,.4);
  }

  /* ---- 計算小工具 ---- */
  .calc-channel-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .calc-channel-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font:inherit;
    font-size:12.5px;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .calc-channel-btn:hover{ color:var(--text); }
  .calc-channel-btn.active{ background:var(--matcha-dim); color:var(--matcha); border-color:var(--matcha); }
  .calc-table-wrap{
    overflow-x:auto;
    margin-bottom:16px;
    border:1px solid var(--line);
    border-radius:12px;
  }
  .calc-table{
    border-collapse:collapse;
    width:100%;
    min-width:920px;
    font-size:12.5px;
  }
  .calc-table th{
    background:var(--panel-2);
    color:var(--muted);
    font-weight:600;
    font-size:11.5px;
    text-align:left;
    padding:10px 8px;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  .calc-table td{
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .calc-table tr:last-child td{ border-bottom:none; }
  .calc-cell-text, .calc-cell-num{
    width:100%;
    min-width:70px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:7px 8px;
    border-radius:6px;
    font:inherit;
    font-size:12.5px;
  }
  .calc-cell-text{ min-width:90px; }
  .calc-cell-text:focus, .calc-cell-num:focus{ outline:none; border-color:var(--matcha); }
  .calc-cell-out{
    color:var(--text);

const LAYOUT_LOCAL_KEY = 'abbott_layout_v1';
let editMode = false;
let layoutCustom = null;
let editDeletePendingKey = null;

function defaultLayoutCustom(){ return {categoryOrder:[], itemOrder:{}, deletedItems:{}, labels:{}}; }
function escJs(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;');
}

function getEffectiveCategories(){
  const lc = layoutCustom || defaultLayoutCustom();
  const order = lc.categoryOrder || [];
  const labels = lc.labels || {};
  const applyLabel = c => labels[c.id] ? {...c, label: labels[c.id]} : c;
  const byId = {}; DATA.forEach(c=>{ byId[c.id]=c; });
  const ordered = order.map(id=>byId[id]).filter(Boolean);
  const remaining = DATA.filter(c=>!order.includes(c.id));
  return [...ordered, ...remaining].map(applyLabel);
}

function renameCategoryLabel(id, newLabel){
  const lc = layoutCustom || (layoutCustom = defaultLayoutCustom());
  if(!lc.labels) lc.labels = {};
  const trimmed = (newLabel||'').trim();
  const original = (DATA.find(c=>c.id===id)||{}).label || '';
  if(!trimmed || trimmed === original){
    delete lc.labels[id];
  } else {
    lc.labels[id] = trimmed;
  }
  saveLayoutCustom();
  render();
}
function getEffectiveItems(cat){
  if(!cat.items) return [];
  const lc = layoutCustom || defaultLayoutCustom();
  const delSet = new Set((lc.deletedItems && lc.deletedItems[cat.id]) || []);
  const remaining = cat.items.filter(it=>!delSet.has(it.name));
  const order = (lc.itemOrder && lc.itemOrder[cat.id]) || [];
  const byName = {}; remaining.forEach(it=>{ byName[it.name]=it; });
  const ordered = order.map(n=>byName[n]).filter(Boolean);
  const rest = remaining.filter(it=>!order.includes(it.name));
  return [...ordered, ...rest];
}

function loadLocalLayout(){
  try{ const raw = localStorage.getItem(LAYOUT_LOCAL_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveLocalLayout(){ try{ localStorage.setItem(LAYOUT_LOCAL_KEY, JSON.stringify(layoutCustom)); }catch(e){} }

function initLayoutCustom(){
  layoutCustom = loadLocalLayout() || defaultLayoutCustom();
  renderNav();
  render();
}

function toggleEditMode(){
  editMode = !editMode;
  editDeletePendingKey = null;
  renderNav();
  render();
}

function renderEditToggle(){
  const wrap = document.getElementById('editToggleWrap');
  if(!wrap) return;
  if(editMode){
    wrap.innerHTML = `
      <button class="btn secondary" onclick="resetLayoutCustom()">↺ 恢復預設排序</button>
      <button class="btn" onclick="toggleEditMode()">✅ 完成編輯</button>
    `;
  } else {
    wrap.innerHTML = `<button class="btn secondary" onclick="toggleEditMode()">🔧 編輯版面</button>`;
  }
}

function moveCategory(id, dir){
  const cats = getEffectiveCategories();
  const idx = cats.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=cats.length) return;
  const ids = cats.map(c=>c.id);
  const tmp = ids[idx]; ids[idx]=ids[swapIdx]; ids[swapIdx]=tmp;
  if(!layoutCustom) layoutCustom = defaultLayoutCustom();
  layoutCustom.categoryOrder = ids;
  saveLocalLayout();
  renderNav();
}

function moveItem(catId, name, dir){
  const cat = DATA.find(c=>c.id===catId);
  if(!cat) return;
  const items = getEffectiveItems(cat);
  const idx = items.findIndex(it=>it.name===name);
  const swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=items.length) return;
  const names = items.map(it=>it.name);
  const tmp = names[idx]; names[idx]=names[swapIdx]; names[swapIdx]=tmp;
  if(!layoutCustom) layoutCustom = defaultLayoutCustom();
  if(!layoutCustom.itemOrder) layoutCustom.itemOrder = {};
  layoutCustom.itemOrder[catId] = names;
  saveLocalLayout();
  render();
}

function requestDeleteItem(catId, name){
  const key = catId+'::'+name;
  if(editDeletePendingKey === key){
    editDeletePendingKey = null;
    if(!layoutCustom) layoutCustom = defaultLayoutCustom();
    if(!layoutCustom.deletedItems) layoutCustom.deletedItems = {};
    if(!layoutCustom.deletedItems[catId]) layoutCustom.deletedItems[catId] = [];
    layoutCustom.deletedItems[catId].push(name);
    saveLocalLayout();
    render();
  } else {
    editDeletePendingKey = key;
    render();
  }
}

function resetLayoutCustom(){
  layoutCustom = defaultLayoutCustom();
  saveLocalLayout();
  renderNav();
  render();
}

function renderNav(){
  renderEditToggle();
  const cats = getEffectiveCategories();
  const icoDims = ['var(--acc1-dim)','var(--acc2-dim)','var(--acc3-dim)','var(--acc4-dim)','var(--acc5-dim)','var(--acc6-dim)'];
  [catsEl, tabbarEl].forEach(container=>{
    container.innerHTML = '';
    cats.forEach((cat,i)=>{
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (cat.id===activeCat ? ' active' : '');
      const count = cat.special ? '' : `<span class="count">${getEffectiveItems(cat).length}</span>`;
      const editBtns = editMode ? `<span class="cat-edit-btns">
          <button class="ebtn mini" onclick="event.stopPropagation();moveCategory('${escJs(cat.id)}',-1)" title="上移">↑</button>
          <button class="ebtn mini" onclick="event.stopPropagation();moveCategory('${escJs(cat.id)}',1)" title="下移">↓</button>
        </span>` : '';
      const labelHTML = editMode
        ? `<input type="text" class="cat-label-input" value="${escJs(cat.label)}"
            onclick="event.stopPropagation()"
            onchange="renameCategoryLabel('${escJs(cat.id)}', this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">`
        : `<span>${cat.label}</span>`;
      btn.innerHTML = `<span class="ico" style="background:${icoDims[i % icoDims.length]}">${cat.icon}</span>${labelHTML}${count}${editBtns}`;
      btn.addEventListener('click', ()=>{ activeCat = cat.id; query=''; searchInput.value=''; render(); });
      container.appendChild(btn);
    });
  });
}

function renderTreeNode(n){
  if(n.children){
    const kids = n.children.map(renderTreeNode).join('');
    return `<div class="tnode">
      <div class="tfolder">📁 ${n.label}</div>
      <div class="tchildren">${kids}</div>
    </div>`;
  }
  return `<a class="tleaf" href="${n.url}" target="_blank" rel="noopener">${n.icon||'📄'} ${n.label} ↗</a>`;
}
function renderTreeNodes(nodes){
  return `<div class="ttree">${nodes.map(n=>renderTreeNode(n)).join('')}</div>`;
}

function categoryAccentColor(catId){
  const cats = getEffectiveCategories();
  const idx = cats.findIndex(c=>c.id===catId);
  const accents = ['var(--acc1)','var(--acc2)','var(--acc3)','var(--acc4)','var(--acc5)','var(--acc6)'];
  return accents[(idx<0?0:idx) % accents.length];
}

function cardHTML(item, mutedClass, catId){
  const accent = categoryAccentColor(catId);
  const links = item.links.map((l,i)=>{
    const cls = i===0 ? 'card-link primary' : 'card-link';
    return `<a class="${cls}" href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`;
  }).join('');
  const key = catId+'::'+item.name;
  const pending = editDeletePendingKey === key;
  const editBar = editMode ? `<div class="edit-bar">
      <button class="ebtn" onclick="moveItem('${escJs(catId)}','${escJs(item.name)}',-1)" title="上移">↑ 上移</button>
      <button class="ebtn" onclick="moveItem('${escJs(catId)}','${escJs(item.name)}',1)" title="下移">↓ 下移</button>
      <button class="ebtn danger" onclick="requestDeleteItem('${escJs(catId)}','${escJs(item.name)}')">${pending?'再按一次確定刪除':'🗑 刪除'}</button>
    </div>` : '';
  return `<div class="card ${mutedClass||''}${editMode?' editing':''}" style="--card-accent:${accent}">
    ${editBar}
    <div class="card-main">
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
    </div>
    <div class="links">${links}</div>
  </div>`;
}

function saveFeeRateChannel(){
  if(!feeRateState) return;

  saveLocalFeeRate(feeRateState.data);

function recalcFeeRateRow(i){
  const get = id => parseFloat(document.getElementById(id).value) || 0;
  const boxCount = get(`fr_r${i}_boxCount`);
  const unitPrice = get(`fr_r${i}_unitPrice`);
  const cansPerBox = get(`fr_r${i}_cansPerBox`);
  const giftCans = get(`fr_r${i}_giftCans`);
  const channelCoin = get(`fr_r${i}_channelCoin`);
  const giftCost = get(`fr_r${i}_giftCost`);

  const regularPrice = boxCount * unitPrice;
  const perCanCost = cansPerBox > 0 ? (unitPrice / cansPerBox) : 0;
  const totalGiftCost = giftCans * perCanCost;
  const feeRate = regularPrice > 0 ? ((totalGiftCost + channelCoin + giftCost) / regularPrice) : 0;

  const fmt = n => n.toLocaleString('zh-TW',{maximumFractionDigits:1});
  document.getElementById(`fr_r${i}_out_regularPrice`).textContent = regularPrice ? fmt(regularPrice) : '-';
  document.getElementById(`fr_r${i}_out_perCanCost`).textContent = perCanCost ? fmt(perCanCost) : '-';
  document.getElementById(`fr_r${i}_out_totalGiftCost`).textContent = totalGiftCost ? fmt(totalGiftCost) : '-';
  document.getElementById(`fr_r${i}_out_feeRate`).textContent = regularPrice ? (feeRate*100).toFixed(2)+'%' : '-';
}

function recalcFeeRate(){
  for(let i=0;i<FEE_RATE_ROW_COUNT;i++) recalcFeeRateRow(i);
}

/* ================= 共用小工具 ================= */
function escapeHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

/* ================= 亞培組公告欄 ================= */
// This standalone file has no Claude runtime, so the board always
// falls back to this browser's own localStorage (personal, not shared).
const ANN_LOCAL_KEY = 'abbott_announcements_v1';
let annState = null;
let annComposerOpen = false;
let annDeletePendingId = null;

function loadLocalAnnouncements(){
  try{ const raw = localStorage.getItem(ANN_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLocalAnnouncements(list){
  try{ localStorage.setItem(ANN_LOCAL_KEY, JSON.stringify(list)); }catch(e){}
}
function initAnnounce(){
  const list = loadLocalAnnouncements().sort((a,b)=>b.createdAt-a.createdAt);
  annState = {docs:list};
  renderAnnounceInto();
}
function toggleAnnComposer(){ annComposerOpen = !annComposerOpen; renderAnnounceInto(); }
function submitAnnouncement(){
  const titleEl = document.getElementById('annTitle');
  const bodyEl = document.getElementById('annBody');
  const title = (titleEl.value||'').trim();
  const content = (bodyEl.value||'').trim();
  if(!content){ bodyEl.focus(); return; }
  const list = loadLocalAnnouncements();
  list.push({id:'a'+Date.now(), title: title||'(無標題)', content, createdAt: Date.now()});
  saveLocalAnnouncements(list);
  annState.docs = list.sort((a,b)=>b.createdAt-a.createdAt);
  annComposerOpen = false;
  renderAnnounceInto();
}
// No native confirm() — click once to arm, click the same button again to confirm.
function requestDeleteAnnouncement(id){
  if(annDeletePendingId === id){
    annDeletePendingId = null;
    const list = loadLocalAnnouncements().filter(a=>a.id!==id);
    saveLocalAnnouncements(list);
    annState.docs = list.sort((a,b)=>b.createdAt-a.createdAt);
  } else {
    annDeletePendingId = id;
  }
  renderAnnounceInto();
}
function renderAnnounceInto(){
  if(activeCat !== 'announce' || announceSubTab !== 'board') return;
  const body = document.getElementById('announceHubBody');
  if(!body) return;
  if(!annState){ body.innerHTML = `<div class="tl-state">正在讀取…</div>`; return; }
  const noteHTML = `<div class="tag warn" style="margin-bottom:14px;">這份是獨立下載版，公告只存在您這台裝置的瀏覽器裡，不會同步給其他同事。要讓全組共用，請用 claude.ai 那個連結。</div>`;
  const composerHTML = annComposerOpen ? `
    <div class="ann-composer">
      <input id="annTitle" type="text" placeholder="標題（選填）">
      <textarea id="annBody" rows="3" placeholder="公告內容…"></textarea>
      <div class="links">
        <button class="btn" onclick="submitAnnouncement()">發布</button>
        <button class="btn secondary" onclick="toggleAnnComposer()">取消</button>
      </div>
    </div>` : `
    <div class="ann-composer">
      <button class="btn" onclick="toggleAnnComposer()">＋ 發布公告</button>
    </div>`;
  const docs = annState.docs || [];
  const listHTML = docs.length ? docs.map(d=>{
    const date = new Date(d.createdAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const pending = annDeletePendingId === d.id;
    return `<div class="ann-item">
      <div class="ann-item-head">
        <strong>${escapeHtml(d.title||'(無標題)')}</strong>
        <span class="ann-meta">${date}</span>
      </div>
      <div class="ann-body">${escapeHtml(d.content)}</div>
      <button class="btn ${pending?'ann-del-confirm':'secondary ann-del'}" onclick="requestDeleteAnnouncement('${d.id}')">${pending?'再按一次確定刪除':'刪除'}</button>
    </div>`;
  }).join('') : `<div class="empty">目前還沒有公告。</div>`;
  body.innerHTML = `${noteHTML}${composerHTML}<div class="ann-list">${listHTML}</div>`;
}

/* ================= 大事紀行事曆 ================= */
const EV_LOCAL_KEY = 'abbott_events_v1';
let evState = null;
let evMonthOffset = 0;
let evSelectedDate = null;
let evComposerOpen = false;
let evDeletePendingId = null;

function loadLocalEvents(){
  try{ const raw = localStorage.getItem(EV_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLocalEvents(list){
  try{ localStorage.setItem(EV_LOCAL_KEY, JSON.stringify(list)); }catch(e){}
}
function initEvents(){
  evState = {docs: loadLocalEvents()};
  renderEventsInto();
}
function eventsShiftMonth(delta){ evMonthOffset += delta; renderEventsInto(); }
function eventsSelectDate(dateStr){ evSelectedDate = dateStr; evComposerOpen = false; renderEventsInto(); }
function toggleEventComposer(){ evComposerOpen = !evComposerOpen; renderEventsInto(); }
function submitEvent(){
  const dateEl = document.getElementById('evDate');
  const titleEl = document.getElementById('evTitle');
  const noteEl = document.getElementById('evNote');
  const date = dateEl.value;
  const title = (titleEl.value||'').trim();
  const note = (noteEl.value||'').trim();
  if(!date || !title){ titleEl.focus(); return; }
  const list = loadLocalEvents();
  list.push({id:'e'+Date.now(), date, title, note, createdAt: Date.now()});
  saveLocalEvents(list);
  evState.docs = list;
  evComposerOpen = false;
  evSelectedDate = date;
  renderEventsInto();
}
function requestDeleteEvent(id){
  if(evDeletePendingId === id){
    evDeletePendingId = null;
    const list = loadLocalEvents().filter(e=>e.id!==id);
    saveLocalEvents(list);
    evState.docs = list;
  } else {
    evDeletePendingId = id;
  }
  renderEventsInto();
}
function renderEventsInto(){
  if(activeCat !== 'announce' || announceSubTab !== 'calendar') return;
  const body = document.getElementById('announceHubBody');
  if(!body) return;
  if(!evState){ body.innerHTML = `<div class="tl-state">正在讀取…</div>`; return; }

  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth()+evMonthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = ymd(today);
  if(!evSelectedDate) evSelectedDate = todayStr;

  const byDate = {};
  (evState.docs||[]).forEach(d=>{ (byDate[d.date] = byDate[d.date]||[]).push(d); });

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${pad2(month+1)}-${pad2(day)}`;
    const dayEvents = byDate[dateStr] || [];
    const isToday = dateStr===todayStr;
    const isSel = dateStr===evSelectedDate;
    const shown = dayEvents.slice(0,3).map(ev=>`<div class="cal-ev-chip" title="${escapeHtml(ev.title||'')}">${escapeHtml(ev.title||'(無標題)')}</div>`).join('');
    const moreCount = dayEvents.length - 3;
    cells += `<div class="cal-cell${isToday?' today':''}${isSel?' selected':''}" onclick="eventsSelectDate('${dateStr}')">
      <span class="cal-daynum">${day}</span>
      <div class="cal-events">
        ${shown}
        ${moreCount > 0 ? `<div class="cal-ev-more">+${moreCount} 筆</div>` : ''}
      </div>
    </div>`;
  }
  const weekLabels = ['日','一','二','三','四','五','六'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const selEvents = byDate[evSelectedDate] || [];
  const selList = selEvents.length ? selEvents.map(d=>{
    const pending = evDeletePendingId === d.id;
    return `<div class="ann-item">
      <div class="ann-item-head"><strong>${escapeHtml(d.title||'(無標題)')}</strong></div>
      ${d.note ? `<div class="ann-body">${escapeHtml(d.note)}</div>` : ''}
      <button class="btn ${pending?'ann-del-confirm':'secondary ann-del'}" onclick="requestDeleteEvent('${d.id}')">${pending?'再按一次確定刪除':'刪除'}</button>
    </div>`;
  }).join('') : `<div class="empty">這天還沒有大事紀。</div>`;

  const composerHTML = evComposerOpen ? `
    <div class="ann-composer">
      <input id="evDate" type="date" value="${evSelectedDate}">
      <input id="evTitle" type="text" placeholder="事項標題">
      <textarea id="evNote" rows="2" placeholder="備註（選填）"></textarea>
      <div class="links">
        <button class="btn" onclick="submitEvent()">新增</button>
        <button class="btn secondary" onclick="toggleEventComposer()">取消</button>
      </div>
    </div>` : `
    <div class="ann-composer">
      <button class="btn" onclick="toggleEventComposer()">＋ 新增大事紀</button>
    </div>`;

  const noteHTML = `<div class="tag warn" style="margin-bottom:14px;">這份是獨立下載版，大事紀只存在您這台裝置的瀏覽器裡，不會同步給其他同事。要讓全組共用，請用 claude.ai 那個連結。</div>`;

  body.innerHTML = `
    ${noteHTML}
    <div class="cal-toolbar">
      <button class="btn secondary" onclick="eventsShiftMonth(-1)">‹ 上個月</button>
      <div class="cal-title">${year}年${month+1}月</div>
      <button class="btn secondary" onclick="eventsShiftMonth(1)">下個月 ›</button>
    </div>
    <div class="cal-grid">
      ${weekLabels}
      ${cells}
    </div>
    <div class="cal-selected-head">📌 ${evSelectedDate}</div>
    <div class="ann-list">${selList}</div>
    ${composerHTML}
  `;
}

/* ================= 公告欄／行事曆 分頁切換 ================= */
let announceSubTab = 'board'; // 'board' | 'calendar'

  renderNav();
  const cat = getEffectiveCategories().find(c=>c.id===activeCat);
  catTitle.textContent = `${cat.icon} ${cat.label}`;
  catSub.textContent = cat.sub;

  if(cat.special){
    if(cat.id === 'announce'){
      renderAnnounceHub();
    } else if(cat.id === 'teamdrive'){
      renderTeamDriveInto();
    } else if(cat.id === 'calc'){
      renderCalcHub();
    } else if(cat.id === 'performance'){
      renderPerformanceInto();
    } else {
      contentEl.innerHTML = renderTasker();
    }
    return;
  }

  const q = query.trim().toLowerCase();
  const allItems = getEffectiveItems(cat);
  const items = q
    ? allItems.filter(it => (it.name+it.desc).toLowerCase().includes(q))
    : allItems;

  if(items.length===0){
    contentEl.innerHTML = `<div class="empty">${q ? `找不到符合「${query}」的項目。` : '這個分類目前沒有項目了。'}</div>`;
    return;
  }

  contentEl.innerHTML = `<div class="grid">${items.map(it=>cardHTML(it, cat.muted?'muted':'', cat.id)).join('')}</div>`;
}


searchInput.addEventListener('input', (e)=>{ query = e.target.value; render(); });

render();
initLayoutCustom();
